<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Daily Briefs — the essentials of the day, in a few minutes">
	<title>Daily Briefs — the essentials of the day, in a few minutes</title>
	<rect width="1200" height="630" fill="#ffffff"/>
	<rect x="0" y="0" width="1200" height="10" fill="#325494"/>

	<g transform="translate(90 78)">
		<rect width="72" height="72" rx="16" fill="#14171c"/>
		<rect x="18" y="21" width="36" height="6" rx="3" fill="#ffffff"/>
		<rect x="18" y="34" width="36" height="6" rx="3" fill="#ffffff" opacity=".68"/>
		<rect x="18" y="47" width="19" height="6" rx="3" fill="#ffffff" opacity=".68"/>
		<circle cx="47" cy="50" r="5" fill="#557ac1"/>
	</g>
	<text x="182" y="126" font-family="Adwaita Sans" font-size="36" font-weight="600" fill="#14171c" letter-spacing="-0.5">Daily Briefs<tspan fill="#325494">.</tspan></text>

	<text x="90" y="300" font-family="Adwaita Sans" font-size="72" font-weight="600" fill="#14171c" letter-spacing="-2">The essentials of the day,</text>
	<text x="90" y="386" font-family="Adwaita Sans" font-size="72" font-weight="600" fill="#14171c" letter-spacing="-2">in a few minutes</text>

	<rect x="90" y="440" width="80" height="4" fill="#325494"/>

	<text x="90" y="504" font-family="Adwaita Sans" font-size="31" font-weight="400" fill="#5c6067">One short summary per topic you follow, every morning.</text>
	<text x="90" y="546" font-family="Adwaita Sans" font-size="31" font-weight="400" fill="#5c6067">Read it or listen to it.</text>
</svg>
