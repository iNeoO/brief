<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Daily Briefs">
	<title>Daily Briefs</title>
	<!-- Three lines of a summary, the last one short, and the accent stop of the
	     wordmark. Geometric rather than a letter: a favicon is rendered by the
	     browser, which has no reason to have the brand font. -->
	<rect width="64" height="64" rx="14" fill="#14171c" />
	<rect x="16" y="19" width="32" height="5" rx="2.5" fill="#ffffff" />
	<rect x="16" y="30" width="32" height="5" rx="2.5" fill="#ffffff" opacity=".68" />
	<rect x="16" y="41" width="17" height="5" rx="2.5" fill="#ffffff" opacity=".68" />
	<circle cx="42" cy="43.5" r="4.5" fill="#557ac1" />
</svg>
