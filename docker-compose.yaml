services:
  postgres:
    container_name: brief-postgres-dev
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      # Offset like Garage below: another project's Postgres commonly holds
      # 5432, and binding it here silently sends the app to that one instead.
      - "127.0.0.1:5433:5432"
    volumes:
      # postgres 18 keeps its data in a subdirectory of this path: mounting
      # /var/lib/postgresql/data instead makes the container refuse to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: brief-redis-dev
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    container_name: brief-rabbitmq-dev
    image: rabbitmq:4-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      # Management UI, on http://localhost:15672 with guest/guest.
      - "127.0.0.1:15672:15672"
    volumes:
      # The queues are declared durable, so persisting them keeps the jobs
      # published before a restart instead of dropping them on the floor.
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. Ports are offset from Garage's defaults so
  # this stack can run next to another project's Garage on the same machine.
  garage:
    container_name: brief-garage-dev
    image: dxflrs/garage:v2.3.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:${S3_PORT}:3900"
      - "127.0.0.1:3913:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  garage-meta:
  garage-data:
