# Analysis settings for the self-hosted SonarQube server. The project key must
# match the one created on the server; the host URL and token come from the CI
# environment (see .github/workflows/ci.yml).
sonar.projectKey=brief
sonar.projectName=brief

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# A file may not be indexed as both source and test, so the test globs are
# repeated here. Everything else listed is generated, vendored or build output.
sonar.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/dist/**,\
  **/coverage/**,\
  apps/web/src/routeTree.gen.ts,\
  db/drizzle/drizzle/**

# Coverage comes from the root vitest run, whose lcov paths are repo-relative.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Only `packages/services` and `apps/category-worker` run vitest, so nothing
# else has coverage to report and would otherwise be measured at 0%. Drop a
# path from this list as soon as its package gets a test suite.
sonar.coverage.exclusions=\
  **/*.config.ts,\
  **/src/**/index.ts,\
  **/src/scripts/**,\
  apps/message-worker/**,\
  apps/providerFetch-worker/**,\
  apps/scheduler/**,\
  apps/web/**,\
  db/drizzle/**,\
  packages/common/**,\
  packages/infra/**

# Uncomment to make the CI job fail when the quality gate fails.
# sonar.qualitygate.wait=true
